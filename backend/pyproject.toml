[project]
name = "smart-learning-agent-backend"
version = "0.1.0"
description = "Student account, homework grading, and targeted practice backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "cryptography>=46.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.9",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.2.0",
    "pyyaml>=6.0",
    "pillow>=12.3.0",
    "pint>=0.25.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "pymysql>=1.2.0",
    "redis>=6.4.0",
    "python-multipart>=0.0.32",
    "restrictedpython>=8.4",
    "sqlalchemy>=2.0.51",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.32.1",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
